name: Release

# Push a tag like v0.1.0 (matching app/build.gradle.kts) to publish a
# signed GitHub Release. NextColor Apps imports attested APK releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check tag matches app version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Unpack signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing. Configure it in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "DashcamViewer-$GITHUB_REF_NAME.apk"

      - name: Attest APK
        uses: actions/attest@v4
        with:
          subject-path: DashcamViewer-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        run: |
          version_code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          gh release create "$GITHUB_REF_NAME" "DashcamViewer-$GITHUB_REF_NAME.apk" \
            --title "DashcamViewer $GITHUB_REF_NAME" \
            --notes-file "fastlane/metadata/android/en-US/changelogs/$version_code.txt"
